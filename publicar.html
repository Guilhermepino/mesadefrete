<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Publicar Frete - MesaDeFrete</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        header {
            background: #111827;
            color: white;
            padding: 18px 30px;
        }

        .topo {
            max-width: 1100px;
            margin: auto;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .logo span {
            color: #f59e0b;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
        }

        nav a:hover {
            color: #f59e0b;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }

        .titulo {
            text-align: center;
            margin-bottom: 30px;
        }

        .titulo h1 {
            font-size: 32px;
            color: #111827;
            margin-bottom: 10px;
        }

        .titulo p {
            color: #6b7280;
        }

        .formulario {
            background: white;
            padding: 35px;
            border-radius: 12px;

            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .linha {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo label {
            font-weight: bold;
            margin-bottom: 7px;
            color: #374151;
        }

        .campo input,
        .campo select,
        .campo textarea {

            width: 100%;

            padding: 12px;

            border: 1px solid #d1d5db;

            border-radius: 7px;

            font-size: 15px;

            outline: none;
        }

        .campo input:focus,
        .campo select:focus,
        .campo textarea:focus {

            border-color: #f59e0b;

        }

        .campo textarea {

            height: 100px;

            resize: vertical;

        }

        .campo-completo {

            margin-bottom: 20px;

        }

        .botoes {

            margin-top: 30px;

            display: flex;

            gap: 10px;

            justify-content: center;

        }

        .botao {

            padding: 14px 25px;

            border-radius: 8px;

            border: none;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

        }

        .publicar {

            background: #f59e0b;

            color: #111827;

        }

        .publicar:hover {

            background: #d97706;

        }

        .voltar {

            background: #e5e7eb;

            color: #111827;

        }

        .voltar:hover {

            background: #d1d5db;

        }

        footer {

            margin-top: 50px;

            background: #111827;

            color: #9ca3af;

            text-align: center;

            padding: 25px;

            font-size: 14px;

        }

        @media (max-width: 700px) {

            .topo {

                flex-direction: column;

                gap: 15px;

            }

            nav a {

                margin: 0 8px;

            }

            .linha {

                grid-template-columns: 1fr;

            }

            .formulario {

                padding: 20px;

            }

        }

    </style>

</head>


<body>


<header>

    <div class="topo">

        <div class="logo">

            MesaDe<span>Frete</span>

        </div>

        <nav>

            <a href="index.html">Início</a>

            <a href="publicar.html">Publicar Frete</a>

        </nav>

    </div>

</header>


<main class="container">


    <div class="titulo">

        <h1>📦 Publicar Novo Frete</h1>

        <p>
            Preencha as informações abaixo para colocar seu frete em leilão.
        </p>

    </div>


    <div class="formulario">


        <div class="linha">

            <div class="campo">

                <label for="origem">
                    Origem
                </label>

                <input
                    type="text"
                    id="origem"
                    placeholder="Ex.: Guarulhos - SP"
                >

            </div>


            <div class="campo">

                <label for="destino">
                    Destino
                </label>

                <input
                    type="text"
                    id="destino"
                    placeholder="Ex.: Rio de Janeiro - RJ"
                >

            </div>

        </div>


        <div class="linha">

            <div class="campo">

                <label for="data">
                    Data da coleta
                </label>

                <input
                    type="date"
                    id="data"
                >

            </div>


            <div class="campo">

                <label for="veiculo">
                    Tipo de veículo
                </label>

                <select id="veiculo">

                    <option value="">
                        Selecione
                    </option>

                    <option>
                        Fiorino
                    </option>

                    <option>
                        VAN
                    </option>

                    <option>
                        VUC
                    </option>

                    <option>
                        3/4
                    </option>

                    <option>
                        Toco
                    </option>

                    <option>
                        Truck
                    </option>

                    <option>
                        Carreta
                    </option>

                </select>

            </div>

        </div>


        <div class="linha">


            <div class="campo">

                <label for="peso">
                    Peso
                </label>

                <input
                    type="number"
                    id="peso"
                    placeholder="Ex.: 1200"
                >

            </div>


            <div class="campo">

                <label for="cubagem">
                    Cubagem (m³)
                </label>

                <input
                    type="number"
                    step="0.01"
                    id="cubagem"
                    placeholder="Ex.: 8,00"
                >

            </div>


        </div>


        <div class="linha">


            <div class="campo">

                <label for="nfs">
                    Quantidade de NFs
                </label>

                <input
                    type="number"
                    id="nfs"
                    placeholder="Ex.: 15"
                >

            </div>


            <div class="campo">

                <label for="valor">
                    Valor inicial do leilão
                </label>

                <input
                    type="number"
                    step="0.01"
                    id="valor"
                    placeholder="Ex.: 1800,00"
                >

            </div>


        </div>


        <div class="campo-completo">

            <div class="campo">

                <label for="tempo">
                    Tempo do leilão
                </label>

                <select id="tempo">

                    <option>
                        15 minutos
                    </option>

                    <option selected>
                        30 minutos
                    </option>

                    <option>
                        1 hora
                    </option>

                    <option>
                        2 horas
                    </option>

                    <option>
                        4 horas
                    </option>

                    <option>
                        8 horas
                    </option>

                    <option>
                        24 horas
                    </option>

                </select>

            </div>

        </div>


        <div class="campo-completo">

            <div class="campo">

                <label for="observacoes">
                    Observações
                </label>

                <textarea
                    id="observacoes"
                    placeholder="Informe detalhes importantes do frete..."
                ></textarea>

            </div>

        </div>


        <div class="botoes">

            <button
                class="botao voltar"
                onclick="window.location.href='index.html'"
            >

                ← Voltar

            </button>


            <button
                class="botao publicar"
                onclick="publicarFrete()"
            >

                🚚 Publicar Leilão

            </button>

        </div>


    </div>

</main>


<footer>

    © 2026 MesaDeFrete — Plataforma de negociação de fretes

</footer>


<script>

function publicarFrete() {

    alert(
        "O formulário foi preenchido!\n\n" +
        "Nesta primeira versão estamos apenas testando a tela.\n\n" +
        "Na próxima etapa vamos fazer o frete ser realmente cadastrado no sistema."
    );

}

</script>


</body>

</html>
